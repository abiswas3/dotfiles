# ── Font ───────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# a little more line spacing
modify_font      cell_height 20px
# show ligatures, but split them under the cursor
disable_ligatures cursor
# slightly heavier glyphs on the dark background
text_composition_strategy 1.7 30

# ── Window / layout ────────────────────────────────────
window_padding_width    14
placement_strategy      center
hide_window_decorations yes
background_opacity       0.95
dynamic_background_opacity yes
confirm_os_window_close  0
enable_audio_bell        no
mouse_hide_wait          3.0
enabled_layouts          splits,stack

# ── Cursor (beam + smooth trail) ───────────────────────
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0
cursor_trail            3
cursor_trail_decay      0.1 0.4

# ── Scrollback ─────────────────────────────────────────
scrollback_lines        10000

# ── Tab bar (always shown so the leader/stack icons are visible) ──
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
# 🟠 = leader armed (terminal-wide), 🥞 = this tab is in stack layout
tab_title_template      "{'🟠 ' if keyboard_mode == 'leader' else ''}{index}: {title}{' 🥞' if layout_name == 'stack' else ''}"

# ── Ctrl+Q leader with ORANGE cursor cue (zellij moved to Ctrl+W, no conflict) ──
# Press Ctrl+Q: cursor turns orange = leader active. Then one key (back to normal).
# y and u split to match zellij; everything opens in the current directory.
map --new-mode leader f24
map ctrl+q combine : set_colors cursor=#ff9e3b : set_background_opacity 0.70 : push_keyboard_mode leader
map --mode leader y      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : launch --location=vsplit --cwd=current
map --mode leader u      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : launch --location=hsplit --cwd=current
map --mode leader c      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : new_tab_with_cwd
map --mode leader w      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : new_os_window_with_cwd
map --mode leader x      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : close_window
map --mode leader n      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : next_tab
map --mode leader p      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : previous_tab
# Ctrl+Q then 1-9/0 -> go to tab 1-10 (ALT+SHIFT+N is taken by Hyprland, so it lives under the leader)
map --mode leader 1      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 1
map --mode leader 2      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 2
map --mode leader 3      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 3
map --mode leader 4      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 4
map --mode leader 5      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 5
map --mode leader 6      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 6
map --mode leader 7      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 7
map --mode leader 8      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 8
map --mode leader 9      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 9
map --mode leader 0      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : goto_tab 10
map --mode leader h      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : neighboring_window left
map --mode leader j      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : neighboring_window bottom
map --mode leader k      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : neighboring_window top
map --mode leader l      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : neighboring_window right
map --mode leader z      combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode : toggle_layout stack
map --mode leader esc    combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode
map --mode leader ctrl+q combine : set_colors cursor=#c0caf5 : set_background_opacity 0.95 : pop_keyboard_mode

