# hyprlock — lock screen
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 2            # seconds of grace after waking before lock kicks in
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1a1aff)
    blur_passes = 2
    blur_size = 7
}

# Password input box
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(ff7f50ff)   # coral, matches your i3 focused-border accent
    inner_color = rgba(2a2a2aff)
    font_color = rgba(e0e0e0ff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    position = 0, -40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(e0e0e0ff)
    font_size = 64
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a0a0a0ff)
    font_size = 18
    font_family = monospace
    position = 0, 50
    halign = center
    valign = center
}
