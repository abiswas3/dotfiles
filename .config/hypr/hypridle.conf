# hypridle — idle management (started from hyprland.lua autostart)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock   # avoid stacking lockscreens
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # wake displays on resume
}

# Lock the screen after 5 min idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the displays off 30s after locking; back on when activity resumes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 min idle
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
